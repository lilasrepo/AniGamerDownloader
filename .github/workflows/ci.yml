name: ci

# Cheap sanity check on every push / PR: byte-compile the source trees so an
# obvious syntax error never reaches a release build, and run the offline unit tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Byte-compile sources
        run: python -m compileall -q core app shells scripts cli.py

  # Offline unit tests (tests/ blocks sockets). Windows, because the app is
  # Windows-only and the config tests exercise Windows paths (F:\temp etc.).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install -r requirements-venv.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
