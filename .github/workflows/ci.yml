name: ci

# Cheap sanity check on every push / PR: byte-compile the source trees so an
# obvious syntax error never reaches a release build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Byte-compile sources
        run: python -m compileall -q core app shells scripts cli.py
